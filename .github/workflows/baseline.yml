# 在 Windows 和 macOS 上执行与本地相同的开发基线，并保留失败诊断所需的报告。
name: Development Baseline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Baseline ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        # CI 不锁 patch 版本：用 "3.12" 让 runner 自动选最新可用 patch。
        # 原因：.python-version 里写的 3.12.14 在最新 runner 镜像（macOS 26 / Windows 2025）
        # 上可能还没有预编译包，导致 setup-python 报 "version not found"。
        # 本地开发仍用 .python-version（3.12.14）给 pyenv；CI 与本地解耦。
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([sys.executable, "-m", "venv", "backend/.venv"], check=True)
          python = Path("backend/.venv") / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([str(python), "-m", "pip", "install", "-r", "backend/requirements.lock"], check=True)

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare Chromium and tokenizer data
        run: node scripts/check-baseline.mjs --prepare

      - name: Run development baseline
        run: node scripts/check-baseline.mjs

      - name: Upload baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ runner.os }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .baseline/run-*/*.log
            .baseline/run-*/*.xml
            .baseline/run-*/summary.json
            .baseline/run-*/app-logs/*.log
