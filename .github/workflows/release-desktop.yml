name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Python
        # CI 不锁 patch 版本：用 "3.12" 让 runner 自动选最新可用 patch。
        # 原因：.python-version 里写的 3.12.14 在最新 runner 镜像（macOS 26 / Windows 2025）
        # 上可能还没有预编译包，导致 setup-python 报 "version not found"。
        # 本地开发仍用 .python-version（3.12.14）给 pyenv；CI 与本地解耦。
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 与开发基线使用同一虚拟环境路径，确保 PyInstaller 不读取全局 Python 包。
      - name: Install backend dependencies
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([sys.executable, "-m", "venv", "backend/.venv"], check=True)
          python = Path("backend/.venv") / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([str(python), "-m", "pip", "install", "-r", "backend/requirements.lock"], check=True)

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build macOS desktop package
        if: runner.os == 'macOS'
        working-directory: frontend
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Windows desktop package
        if: runner.os == 'Windows'
        working-directory: frontend
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reflexionos-${{ runner.os }}
          path: frontend/release/**

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.yml" \) -exec cp {} release-files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: release-files/*
